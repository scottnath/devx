name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify (rules, tests, typecheck, build, storybook)
        run: npm run verify

      - name: Generated docs are up to date
        run: git diff --exit-code -- docs/gitmoji-rules.md docs/how-to-write-a-commit.md
